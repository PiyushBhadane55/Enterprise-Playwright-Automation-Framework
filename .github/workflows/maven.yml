name: Enterprise Java CI with Maven

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      # Start local PostgreSQL service
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: automation_db_qa
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Start MailHog service
      mailhog:
        image: mailhog/mailhog:latest
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install Playwright OS Dependencies
        run: |
          mvn dependency:resolve
          mvn exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install-deps"
          mvn exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install"

      - name: Run Automation Suite
        run: mvn test -Denv=qa -Dbrowser=chrome
        env:
          DB_URL: jdbc:postgresql://localhost:5432/automation_db_qa
          DB_USER: postgres
          DB_PASS: postgres

      - name: Upload Screenshots and Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failures
          path: |
            target/screenshots/
            target/videos/
            target/traces/
            logs/
          if-no-files-found: ignore

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results/
          if-no-files-found: ignore
